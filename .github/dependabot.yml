version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The engines the library builds on.
      engines:
        patterns: ['pptxgenjs', 'yoga-layout', 'jszip', 'fast-xml-parser']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
