name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest's V8 coverage needs Node; `bun run` hands the tool binaries to it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Code samples in the README and docs are in sync
        run: node scripts/samples.js --check
      - name: Format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test with coverage
        run: bun run test:coverage
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: packages/vue-pptx-document/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Build (library, size-limit budgets, demo)
        run: bun run build
      - name: Check the package (publint, type resolution)
        run: bun run lint:package
      # The runtime and pack jobs test this build instead of building it again.
      - name: Keep the built library for the runtime jobs
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/vue-pptx-document/dist/
          retention-days: 1
      - name: Install the packed tarball and render from it
        run: bun run test:pack
      - name: End-to-end tests of the demo app
        run: |
          bunx playwright install --with-deps chromium firefox webkit
          bun run --filter example test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/example/test-results/
          retention-days: 7
      - name: Build docs
        run: bun run build:docs

  # The library declares vue ^3.5.0 and node >=20.19, so it's tested against the oldest Vue in
  # that range and the newest one on npm, and on the oldest, the current and the newest Node.
  # Vue latest runs on Node 22 only, to keep the number of jobs down.
  runtime:
    name: Node ${{ matrix.node }}, Vue ${{ matrix.vue }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']
        vue: ['3.5.0']
        include:
          - node: '22'
            vue: latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install with vue@${{ matrix.vue }}
        run: |
          npm pkg set overrides.vue=${{ matrix.vue }}
          bun install
      - name: Check the installed version
        working-directory: packages/vue-pptx-document
        env:
          EXPECTED: ${{ matrix.vue }}
        run: |
          actual=$(node -p "require('vue/package.json').version")
          echo "vue $actual"
          if [ "$EXPECTED" != latest ] && [ "$actual" != "$EXPECTED" ]; then exit 1; fi
      - name: Typecheck the library
        run: bun run --filter vue-pptx-document typecheck
      - name: Unit tests
        run: bun run test
      - name: Download the built library
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/vue-pptx-document/dist/
      - name: Install the packed tarball and render from it
        run: bun run test:pack

  # The tarball, its CLI and its subpaths on the three operating systems.
  pack:
    name: Pack test on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Download the built library
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/vue-pptx-document/dist/
      - name: Install the packed tarball, render and run the CLI
        run: bun run test:pack

  # New dependencies are checked for known vulnerabilities and licenses before they merge.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
